<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8AEBFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="6"/>

  <!-- Headphone Audio Arch -->
  <path d="M146 256 C146 186, 195 132, 256 132 C317 132, 366 186, 366 256" fill="none" stroke="url(#cyanGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Left & Right Ear Cushions -->
  <rect x="126" y="236" width="38" height="78" rx="18" fill="#0A0F1D" stroke="#22D3EE" stroke-width="8"/>
  <rect x="348" y="236" width="38" height="78" rx="18" fill="#0A0F1D" stroke="#22D3EE" stroke-width="8"/>

  <!-- Audio Equalizer Bars -->
  <line x1="196" y1="230" x2="196" y2="282" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="226" y1="205" x2="226" y2="307" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="180" x2="256" y2="332" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="286" y1="205" x2="286" y2="307" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round"/>
  <line x1="316" y1="230" x2="316" y2="282" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round"/>

  <!-- Bookmark Ribbon on Top Right -->
  <path d="M362 108 L392 108 L392 152 L377 140 L362 152 Z" fill="url(#amberGrad)" stroke="#0A0F1D" stroke-width="3"/>
</svg>